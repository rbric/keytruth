[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "keytruth"
version = "0.1.0"
description = "A local-only CLI that discovers API credentials, proves which ones still work, identifies dangerous reuse, and never uploads or stores the secrets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT License" }
authors = [{ name = "rbric" }]
dependencies = []
keywords = ["security", "secrets", "api-keys", "cli", "env"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/rbric/keytruth"
Repository = "https://github.com/rbric/keytruth"
Issues = "https://github.com/rbric/keytruth/issues"
Changelog = "https://github.com/rbric/keytruth/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "build"]

[project.scripts]
keytruth = "keytruth:main"

[tool.setuptools]
py-modules = ["keytruth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
